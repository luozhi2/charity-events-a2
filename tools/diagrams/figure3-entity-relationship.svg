<text x="58" y="612" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F3C66" text-anchor="start" font-weight="bold">Referential integrity and constraints</text>
<text x="58" y="634" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16232E" text-anchor="start">fk_events_organisation    events.organisation_id  →  organisations.organisation_id        ON UPDATE CASCADE    ON DELETE RESTRICT</text>
<text x="58" y="652" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16232E" text-anchor="start">fk_events_category        events.category_id  →  categories.category_id                         ON UPDATE CASCADE    ON DELETE RESTRICT</text>
<text x="58" y="670" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16232E" text-anchor="start">chk_events_amounts    goal_amount ≥ 0  AND  raised_amount ≥ 0            chk_events_ticket    ticket_price ≥ 0</text>
<text x="58" y="688" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16232E" text-anchor="start">UNIQUE    organisations.name,  categories.category_name            INDEX    event_date, city, status, category_id, organisation_id</text>
<text x="58" y="706" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A6B78" text-anchor="start" font-style="italic">PK = primary key   ·   FK = foreign key   ·   UQ = unique   ·   AI = AUTO_INCREMENT        Engine: InnoDB        Charset: utf8mb4</text>
<rect x="672" y="200" width="228" height="116" rx="6" fill="#FDF1E0" stroke="#E08A2F" stroke-width="1.5"/>
<text x="786" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A5713" text-anchor="middle" font-weight="bold">Assessment 3 extension</text>
<text x="786" y="244" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16232E" text-anchor="middle">users  (1)</text>
<text x="786" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6B78" text-anchor="middle">↓</text>
<text x="786" y="278" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16232E" text-anchor="middle">registrations  (M)</text>
<text x="786" y="294" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A6B78" text-anchor="middle">ticket purchases and</text>
<text x="786" y="308" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A6B78" text-anchor="middle">donations against events</text>
<rect x="672" y="336" width="228" height="88" rx="6" fill="#FDEAEE" stroke="#F2C2CD" stroke-width="1.5"/>
<text x="786" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8C2137" text-anchor="middle" font-weight="bold">Policy enforcement</text>
<text x="786" y="378" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16232E" text-anchor="middle">status = "suspended"</text>
<text x="786" y="394" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A6B78" text-anchor="middle">is retained for audit but</text>
<text x="786" y="408" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A6B78" text-anchor="middle">filtered out by the API, so it</text>
<text x="786" y="422" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5A6B78" text-anchor="middle">never reaches the website</text>
